name: CI

# EXPERIMENT ONLY (never merge): does Windows Defender real-time scanning cause the e2e stalls?
on:
  pull_request:

jobs:
  stall:
    strategy:
      fail-fast: false
      matrix:
        defender: [on, off]
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - if: matrix.defender == 'off'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true; (Get-MpPreference).DisableRealtimeMonitoring
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
