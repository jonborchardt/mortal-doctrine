name: CI

# EXPERIMENT ONLY (never merge): which test stalls the Windows runner?
on:
  pull_request:

jobs:
  stall:
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: no-camera-145, args: '--grep-invert "near framing at a bound"' }
          - { name: no-effects, args: '--grep-invert "studio-effects"' }
          - { name: only-camera-effects, args: 'studio-camera studio-effects' }
          - { name: one-worker, args: '--workers=1' }
        run: [1, 2, 3, 4, 5]
    name: ${{ matrix.variant.name }} ${{ matrix.run }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --reporter=list ${{ matrix.variant.args }}
